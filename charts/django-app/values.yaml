replicaCount: 2

image:
  repository: 757370076418.dkr.ecr.us-west-2.amazonaws.com/lesson-8-9-django-app
  pullPolicy: Always
  tag: "v1.0.23"

nameOverride: ""
fullnameOverride: ""

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

config:
  SECRET_KEY: "django-app"
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  POSTGRES_DB: "project"
  POSTGRES_USER: "myuser"
  POSTGRES_PASSWORD: "mypassword"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

nodeSelector: {}
tolerations: []
affinity: {}