version: '3.9'
services:
  web:
    build:
      context: ./django_app
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_app:/app
    env_file: .env
    ports:
      - '8000:8000'
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '80:80'
    depends_on:
      - web

volumes:
  postgres_data:
